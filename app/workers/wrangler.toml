name = "oqim-server"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [{ name = "GAME_ROOM", class_name = "GameRoom" }, { name = "RATE_LIMITER", class_name = "RateLimiter" }]

[[migrations]]
tag = "v1"
new_classes = ["GameRoom"]

[[migrations]]
tag = "v2-audit"
new_sqlite_classes = ["RateLimiter"]

[observability]
enabled = true
