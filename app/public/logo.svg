<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- 8-pointed suzani star: two overlapping squares -->
  <g fill="none" stroke="#2E7D5F" stroke-width="4" stroke-linejoin="round">
    <rect x="22" y="22" width="52" height="52" rx="6"/>
    <rect x="22" y="22" width="52" height="52" rx="6" transform="rotate(45 48 48)"/>
  </g>
  <!-- gold coin circle at center -->
  <circle cx="48" cy="48" r="17" fill="#D9A441"/>
  <circle cx="48" cy="48" r="13.5" fill="none" stroke="#B98428" stroke-width="1.6"/>
  <!-- flow arrow curving through the coin -->
  <path d="M38 52 Q44 40 54 42 Q60 43.5 58.5 50" fill="none" stroke="#FBF8F2" stroke-width="3" stroke-linecap="round"/>
  <path d="M61.5 45.5 L58.5 51.5 L53.5 47.5 Z" fill="#FBF8F2"/>
</svg>
